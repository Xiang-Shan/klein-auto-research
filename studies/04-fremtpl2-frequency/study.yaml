schema_version: 2
study_id: "04-fremtpl2-frequency"
goal: "On freMTPL2 claim frequency, does gradient boosting beat a well-specified GLM by more than the measured noise floor in Poisson deviance?"
domain: "insurance"
target: "ClaimNb"
task_type: "simulation"       # classification | regression | simulation
method_depth: "full" # brief | full
family: "glm-vs-gbdt"

# A track owns its metric frontier. Never compare unrelated research tasks globally.
tracks:
  primary:
    metric:
      name: "val_poisson_deviance"
      goal: "lower"     # higher | lower
      minimum_delta: 0.001786   # = 2x PAIRED-difference bootstrap SE (see program.md 2026-07-31)
      noise_floor:
        k: 5
        seeds: [0, 1, 2, 3, 4]
        std: 0.000210143          # HGBT fit-seed spread (the sweep)
        range: 0.000512
        mean: 0.444913
        source: "sweeps/noise_floor.sidecar.tsv"
        measured_after: "E0001"
    guardrails:
      wall_seconds:
        max: 240

data:
  source: "data_hub:freMTPL2"
  prepared_path: "data/prepared/fremtpl2_frequency.csv"
  split:
    kind: random           # stratified | random | group | time | none (simulation)
    seed: 42
    development_size: 0.20
    test_size: 0.20

    # group_column: account_id     # required when kind=group
    # time_column: event_time      # required when kind=time

# Per-run, per-phase time, and experiment-count limits are intentionally separate.
max_run_seconds: 300
phases:
  - id: adaptive-1
    description: "anchor (null-deviance identity, STOP if off), noise-floor sweep, slate, then GLM-vs-GBDT ladder"
    budget_seconds: 3600
    max_experiments: 5
  - id: confirmation
    description: "one sealed final-test evaluation of the incumbent"
    budget_seconds: 600
    max_experiments: 1

research_questions:
  - id: RQ1
    question: "Does HGBT with Poisson loss beat the plain OHE GLM on development Poisson deviance by more than minimum_delta?"
    prior: "Yes, by several times the floor: boosted trees dominate raw GLMs on this exact dataset in the literature. (source: knowledge/method_cards/gbdt-tabular.md; Noll-Salzmann-Wuthrich case study)"
  - id: RQ2
    question: "Does GLM feature shaping (log-density, spline age/bonus-malus) close a material part of the GLM-to-GBDT gap?"
    prior: "Yes, a large part but not all — GLM+shaping approaches but does not reach GBDT. (source: knowledge/method_cards/glm-pricing.md)"
  - id: RQ3
    question: "Does native categorical handling beat one-hot encoding for HGBT at freMTPL2's cardinality?"
    prior: "Roughly a tie — within 2x the noise floor at moderate cardinality. (source: knowledge/encoder-comparison.md)"

predictions_to_falsify:
  - lever: "GLM baseline -> HGBT poisson baseline (RQ1)"
    predicted_delta: "val_poisson_deviance improves by >= 3x the measured noise-floor std (KEEP)"
  - lever: "GLM baseline -> GLM + shaping (RQ2)"
    predicted_delta: "improves by > minimum_delta but stays > 2x floor short of HGBT (KEEP, not incumbent for long)"
  - lever: "HGBT OHE -> HGBT native categoricals (RQ3)"
    predicted_delta: "within 2x noise-floor std -> DISCARD by the measured minimum_delta"

deliverables:
  - findings.md
  - report/index.html
