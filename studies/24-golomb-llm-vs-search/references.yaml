    doi: "10.1126/science.220.4598.671"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; OpenAlex abstract on the statistical-mechanics analogy for combinatorial optimization)"
    verified_at: "2026-11-03"
    why: "The acceptance rule the search arm uses: accept a worse state with probability exp(-delta / T) under a cooling schedule (search.py SA_T0, SA_COOLING, SA_T_MIN)."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "Optimization by Simulated Annealing"
    resolved_at: "2026-11-03"
  dotu2005:
    title: "A simple Hybrid Evolutionary Algorithm for Finding Golomb Rulers"
    authors: "Dotu, I.; Van Hentenryck, P."
    year: 2005
    venue: "2005 IEEE Congress on Evolutionary Computation, vol. 3, 2018-2023"
    doi: "10.1109/CEC.2005.1554943"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; OpenAlex abstract: the algorithm 'focuses on feasibility, finding near-optimal rulers indirectly', 'quickly finds optimal rulers with up to 11 marks and isolates optimal rulers with up to 14 marks in reasonable time')"
    verified_at: "2026-11-03"
    why: "The classical-heuristic regime anchor: a hybrid evolutionary algorithm that focuses on feasibility (per its abstract) reaches the optima through order 11 - at a budget the abstract states in time, not in evaluations, and that is not this study's 2,000. search.py's fixed-length annealer is a design in the same feasibility-first family, NOT the same algorithm: it is a single-trajectory annealer with restarts, not an evolutionary algorithm."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "A simple Hybrid Evolutionary Algorithm for Finding Golomb Rulers"
    resolved_at: "2026-11-03"
  patternboost2024:
