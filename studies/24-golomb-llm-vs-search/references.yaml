    year: 2024
    venue: "arXiv preprint"
    arxiv: "2411.00566"
    doi: "10.48550/arXiv.2411.00566"
    verified: true
    verified_by: "klein-method-scholar (OpenAlex record of the arXiv DOI with abstract: alternates a classical local search with a transformer trained on the best constructions it found)"
    verified_at: "2026-11-03"
    why: "The design that removes the recall confound by construction: its transformer is trained from scratch on the search's own outputs, so it cannot have read a table. The contrast case for this study's pretrained proposer."
    resolved_by: "klein-refs (openalex)"
    resolved_title: "PatternBoost: Constructions in Mathematics with a Little Help from AI"
    resolved_at: "2026-11-03"
  carlini2023:
    title: "Quantifying Memorization Across Neural Language Models"
    authors: "Carlini, N.; Ippolito, D.; Jagielski, M.; Lee, K.; Tramer, F.; Zhang, C."
    year: 2023
    venue: "ICLR 2023 (arXiv v1 2022-02-15)"
    arxiv: "2202.07646"
    doi: "10.48550/arXiv.2202.07646"
    verified: true
    verified_by: "klein-method-scholar (iclr.cc/virtual/2023/poster/11469 lists the paper and authors at ICLR 2023; arxiv.org abstract: three log-linear relationships - memorization grows with model capacity, with the number of times an example is duplicated, and with the context tokens in the prompt)"
    verified_at: "2026-11-03"
    why: "Why recall is plausible and why its rate should vary: a short integer list duplicated across Wikipedia, OEIS-linked tables and their mirrors is the kind of string memorization grows with; a fast-tier model of undisclosed capacity, prompted with a short context, may memorize less."
    resolved_by: "klein-refs (openalex)"
    resolved_title: "Quantifying Memorization Across Neural Language Models"
    resolved_at: "2026-11-03"
