    verified_at: "2026-11-03"
    why: "The upper bound sqrt(N) + O(N^(1/4)) on a Sidon subset of {1..N} - equivalently a lower bound of n^2 - O(n^(3/2)) on the length of an n-mark Golomb ruler (card section 2, equation 2)."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "On a Problem of Sidon in Additive Number Theory, and on some Related Problems"
    resolved_at: "2026-11-03"
  singer1938:
    title: "A theorem in finite projective geometry and some applications to number theory"
    authors: "Singer, J."
    year: 1938
    venue: "Transactions of the American Mathematical Society 43(3), 377-385"
    doi: "10.1090/S0002-9947-1938-1501951-4"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; OpenAlex abstract on PG(2, p^n), q = p^2n + p^n + 1 points and lines; the Sidon-set consequence read from wikipedia_sidon)"
    verified_at: "2026-11-03"
    why: "The matching construction: perfect difference sets of q+1 residues modulo q^2+q+1 for every prime power q, i.e. Golomb rulers of length below q^2+q+1. Shows the order of magnitude n^2 is right; it does not reach the tabulated optima at this study's orders."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "A theorem in finite projective geometry and some applications to number theory"
    resolved_at: "2026-11-03"
  wikipedia_sidon:
    title: "Sidon sequence"
    authors: "Wikipedia contributors"
    year: 2026
