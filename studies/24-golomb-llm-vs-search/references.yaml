# The citations a `ref:<key>` evidence id resolves to (shape: kleinlib/references.py).
# Written at the METHOD gate on 2026-11-03 by the method scholar. Every row was checked
# against a primary record on that date, never quoted from memory: DOIs at Crossref
# (title, container, volume, issue, pages, issued date, authors) with the abstract read
# from OpenAlex where one is deposited; arXiv ids via OpenAlex's record of the
# 10.48550/arXiv.<id> DOI plus the arxiv.org abstract page (export.arxiv.org timed
# out from this machine); web pages by fetching the page itself. `klein refs verify
# --record` then adds the mechanical title match (resolved_*).
#
# What each row is relied on FOR is in `why`. Where a row is a secondary source for a
# fact whose primary was not located, `why` says so: that fact is cited as "per
# <secondary>", never as if the primary had been read.
references:
  oeis_a003022:
    title: "A003022: Length of shortest (or optimal) Golomb ruler with n marks"
    authors: "OEIS Foundation (sequence entry and its editors)"
    year: 2026
    venue: "The On-Line Encyclopedia of Integer Sequences"
    url: "https://oeis.org/A003022"
    verified: true
    verified_by: "klein-method-scholar (WebFetch of the entry: name, offset 2, terms a(2..28) = 1, 3, 6, 11, 17, 25, 34, 44, 55, 72, 85, 106, 127, ..., 553, 585 read off the page; a(8..13) = 34, 44, 55, 72, 85, 106 equal instance.json; comments credit a(27) to OGR-27 and a(28) to OGR-28)"
    verified_at: "2026-11-03"
    why: "The source of every optimum this study compares against (instance.json `optima`). OEIS records lengths, not proofs: the proofs of optimality are the exhaustive searches cited below."
  wikipedia_golomb:
    title: "Golomb ruler"
    authors: "Wikipedia contributors"
    year: 2026
    venue: "Wikipedia, The Free Encyclopedia"
    url: "https://en.wikipedia.org/wiki/Golomb_ruler"
    verified: true
    verified_by: "klein-method-scholar (WebFetch of the article, table of known optimal rulers)"
    verified_at: "2026-11-03"
    why: "SECONDARY source for three facts the card uses: (a) the table lists all known optimal rulers excluding mirror images - one each at orders 8, 9, 10, 12 and 13, two at order 11 (and 2, 4, 5 at orders 5, 6, 7, which the card re-derived by an exhaustive enumeration pinned as sweeps/toy_enumeration.py and sweeps/toy_enumeration.tsv); (b) proof credits - orders 8-11 to William Mixon (1972), 12 to J. P. Robinson (1979), 13 to Robinson (1981), 14 to Shearer (1985); the Mixon primary was NOT located, so 'optimal' at orders 8-11 rests on this row and on oeis_a003022; (c) distributed.net completion dates, OGR-24 (2004-10-13) to OGR-28 (2022-11-23). The table also prints the optimal rulers themselves, through order 28 - it is a page a language model may have read."
  robinson1979:
    title: "Optimum Golomb Rulers"
    authors: "Robinson, J. P. (Crossref deposits the surname only; 'John P. Robinson' per wikipedia_golomb)"
    year: 1979
    venue: "IEEE Transactions on Computers C-28(12), 943-944"
    doi: "10.1109/TC.1979.1675287"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; OpenAlex abstract: 'A fast search procedure is outlined for determining the shortest ruler. For 12 marks the shortest ruler is 85 units.')"
    verified_at: "2026-11-03"
    why: "The primary for the sealed order 12: the shortest 12-mark ruler has length 85, established by search. P4 and P5 compare against this number."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "Optimum Golomb Rulers"
    resolved_at: "2026-11-03"
  robinson1983:
    title: 'Addendum to "Optimum Golomb Rulers"'
