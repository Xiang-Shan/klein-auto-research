    verified: true
    verified_by: "klein-method-scholar (WebFetch of the article)"
    verified_at: "2026-11-03"
    why: "SECONDARY source for the statements of the Sidon-set results: 'All finite Sidon sets are Golomb rulers, and vice versa'; the Erdos-Turan bound sqrt(x) + O(x^(1/4)), improved by Lindstrom (1969) and by Balogh, Furedi and Roy (2023); Singer's (1 - o(1)) sqrt(x) construction."
  funsearch2024:
    title: "Mathematical discoveries from program search with large language models"
    authors: "Romera-Paredes, B.; Barekatain, M.; Novikov, A.; Balog, M.; Kumar, M. P.; Dupont, E.; Ruiz, F. J. R.; Ellenberg, J. S.; Wang, P.; Fawzi, O.; Kohli, P.; Fawzi, A."
