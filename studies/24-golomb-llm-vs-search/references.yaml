  opro2024:
    title: "Large Language Models as Optimizers"
    authors: "Yang, C.; Wang, X.; Lu, Y.; Liu, H.; Le, Q. V.; Zhou, D.; Chen, X."
    year: 2024
    venue: "ICLR 2024 (arXiv v1 2023-09-07, v3 2024-04-15)"
    arxiv: "2309.03409"
    doi: "10.48550/arXiv.2309.03409"
    verified: true
    verified_by: "klein-method-scholar (arxiv.org abstract page: 7 authors, comments field 'ICLR 2024'; abstract: each step the LLM generates new solutions from a prompt holding previous solutions with their values; OpenAlex record of the arXiv DOI)"
    verified_at: "2026-11-03"
    why: "The template this study's LLM arm is styled on: solutions as DATA, scored by the task, fed back into the prompt. It is NOT OPRO's loop: OPRO's meta-prompt accumulates previously generated solutions with their values, while search.py sends back only the previous batch with its verdicts and the best length so far (an OPRO-style loop with a one-batch memory). It is the regime in which recall and search are hardest to tell apart, because the output is the same kind of object a table stores."
    resolved_by: "klein-refs (openalex)"
    resolved_title: "Large Language Models as Optimizers"
    resolved_at: "2026-11-03"
