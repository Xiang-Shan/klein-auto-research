    verified: true
    verified_by: "klein-method-scholar (WebFetch of the page: defines an OGR as 'the shortest Golomb Ruler possible for a given number of marks'; the page itself is stale and does not list stage results, which are taken from oeis_a003022 comments and wikipedia_golomb)"
    verified_at: "2026-11-03"
    why: "The volunteer-computing project whose stages OGR-24 to OGR-28 proved the optimal lengths at orders 24-28 (dates per wikipedia_golomb; a(27), a(28) attributions per oeis_a003022). The scale anchor for 'why optimality is hard': OGR-27 completed in 2014 and OGR-28 only in 2022 (per wikipedia_golomb)."
