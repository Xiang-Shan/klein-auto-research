    doi: "10.1038/s41586-023-06924-6"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; OpenAlex abstract: an LLM paired with 'a systematic evaluator'; 'FunSearch searches for programs that describe how to solve a problem, rather than what the solution is'; cap sets and online bin packing)"
    verified_at: "2026-11-03"
    why: "The seminal verifier-guided LLM search. Its key design choice - evolve PROGRAMS, not objects - is exactly what this study's LLM arm does NOT do, and is the reason a FunSearch result is hard to explain by recall while this study's LLM matches are easy to."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "Mathematical discoveries from program search with large language models"
