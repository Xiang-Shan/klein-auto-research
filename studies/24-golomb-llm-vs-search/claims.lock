    "C7": {
      "claim": "Untested hypothesis: the LLM arm's matches are retrieval of tabulated rulers. Every matched ruler is the row the public table prints, and the best ruler in all three trials at order ten is the first ten marks of the tabulated eleven-mark ruler, a Golomb ruler by inheritance at length 70 against the optimum 55. But identity with a unique tabulated optimum cannot separate recall from search, and the study ran no control that could.",
      "class": "mechanism-interpretation",
      "errata": [],
      "evidence": [
        "E0004",
