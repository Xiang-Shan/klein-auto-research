    "C9": {
      "claim": "The method card's prior that recall dominates the matches (first-batch matches at least half the matched count, a bar of 3) is refuted at 1. Its other four card-level priors held: the search arm matched 0 of 12, its mean gap was non-decreasing with order and 35.333 at the largest development order, every development order clustered all-or-none for the LLM arm, and the LLM arm was not behind at +6 pairs.",
