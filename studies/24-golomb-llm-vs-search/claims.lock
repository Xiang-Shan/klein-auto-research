      "claim": "The matched rulers re-attain upper bounds already known to be tight, length 34 at eight marks and 72 at eleven marks per the OEIS table, so the study establishes nothing new about any Golomb length, and every miss is a fact about these proposers at this budget, never evidence that a shorter ruler or a match is out of reach.",
