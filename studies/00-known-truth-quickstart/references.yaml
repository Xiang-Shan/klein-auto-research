references:
  hanley1982:
    title: "The meaning and use of the area under a receiver operating characteristic (ROC) curve"
    authors: "Hanley, J. A.; McNeil, B. J."
    year: 1982
    venue: "Radiology 143(1), 29-36"
    doi: "10.1148/radiology.143.1.7063747"
    url: "https://pubs.rsna.org/doi/10.1148/radiology.143.1.7063747"
    verified: true
    verified_by: "orchestrating agent (WebSearch, publisher + author copy)"
    verified_at: "2026-09-03"
    why: "AUC = P(score of a random positive > score of a random negative); this identity is why ranking rows by the TRUE probability is optimal, which is what makes a Bayes AUC computable at all."
  friedman2001:
    title: "Greedy function approximation: a gradient boosting machine"
    authors: "Friedman, J. H."
    year: 2001
    venue: "The Annals of Statistics 29(5), 1189-1232"
    doi: "10.1214/aos/1013203451"
    url: "https://projecteuclid.org/journals/annals-of-statistics/volume-29/issue-5/Greedy-function-approximation-A-gradient-boosting-machine/10.1214/aos/1013203451.full"
    verified: true
    verified_by: "orchestrating agent (WebSearch, Project Euclid page)"
    verified_at: "2026-09-03"
    why: "The stagewise additive fit the boosted rung of this ladder performs; the source of the claim that boosting approximates an arbitrary smooth log-odds surface without being told its terms."
  ke2017:
    title: "LightGBM: a highly efficient gradient boosting decision tree"
    authors: "Ke, G.; Meng, Q.; Finley, T.; Wang, T.; Chen, W.; Ma, W.; Ye, Q.; Liu, T.-Y."
