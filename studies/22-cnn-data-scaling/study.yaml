schema_version: 3
study_id: "22-cnn-data-scaling"
goal: "Estimate the data-scaling exponent of a small CNN's test cross-entropy on Fashion-MNIST, and test whether the power law fitted on small training sets predicts the loss at the full training set (a sealed extrapolation)."
domain: "deep-learning scaling (image classification)"
target: "label"

# The three axes (references/inquiry-model.md). kind fixes the default track
# mode, what "sealed" means, the confirmation default and the strength ceiling.
kind: "estimate"                  # predict | estimate | test | simulate | replicate | discover | optimize
profile: "ml-research"            # generic | ml-research | math | insurance | llm | cv | data-science
# profile_doc: profiles/my-field.md   # ... or a repo-relative profile of your own
audience: "an ML researcher who quotes scaling exponents and wants to know how much one fitted on small data is worth for predicting the next order of magnitude"

task_type: "scalar"       # classification | regression | scalar (simulation is the old spelling)
method_depth: "full" # brief | full
family: "cnn"

# The declared entrypoint. `mutable` is THE per-experiment surface — one
# falsifiable idea per candidate — and nothing else in the study may change
# inside a run. A declared verifier is never listed here.
entrypoint:
  command: ["uv", "run", "--locked", "python", "-u", "analyze.py"]
  mutable: ["analyze.py"]
  printed: block                # metrics are read from the final `---` block only
  seeds: [0, 1, 2]             # one candidate = one seed array; the notary decides on the mean
  execution: [local, detached] # a cell may run as a detached job (klein job exec), judged at collect

# A track owns its metric frontier. Never compare unrelated research tasks globally.
tracks:
  primary:
    kind: estimate
    mode: registered          # one cell = one training-set size N, a 3-seed array
    metric:
      name: "val_mlogloss"
      goal: "lower"
      minimum_delta: 0.001
      exactness: stochastic
    guardrails:
      wall_seconds: {max: 3600}
    confirmation:
      require: [sealed, replicate]
  exponent:
    kind: estimate
    mode: registered          # the power-law fit over every pinned development cell
    metric:
      name: "scaling_exponent"
      goal: "higher"
      minimum_delta: 0.001
      exactness: stochastic
    guardrails:
      wall_seconds: {max: 300}
    confirmation:
      require: [replicate]
data:
  source: "url:https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion/train-images-idx3-ubyte.gz"
  sha256: "3aede38d61863908ad78613f6a32ed271626dd12800ba2636569512369268a84"
  inputs:
    - {source: "url:https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion/train-labels-idx1-ubyte.gz", sha256: "a04f17134ac03560a47e3764e11b92fc97de4d1bfaf8ba1a3aa29af54cc90845"}
    - {source: "url:https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion/t10k-images-idx3-ubyte.gz", sha256: "346e55b948d973a97e58d2351dde16a484bd415d4595297633bb08f03db6a073"}
    - {source: "url:https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion/t10k-labels-idx1-ubyte.gz", sha256: "67da17c76eaffca5446c3361aaab5c3cd6d1c2608764d35dfb1850b086bf8dd5"}
  modality: "image"
  prepared_path: "data/prepared"
  split:
    kind: predefined        # train = official train rows 0-49,999; development = rows 50,000-59,999; test = official t10k (sealed)
    index: index.csv        # id, label, split
    id_column: id
    label_column: label
    split_column: split
    seed: 42                # inert: positions, not a seed, define the partitions

policy:
  card_sections: enforce
  realized_split: required
  noise_floor: required

# Per-run, per-phase time, and experiment-count limits are intentionally separate.
max_run_seconds: 5400   # bounds a whole 3-seed array; the sealed N=60,000 array needs about 1,800 s at 1 thread
phases:
  - id: cells
    description: "six registered training-set sizes N = 500, 1,000, 2,000, 4,000, 8,000, 16,000, each a 3-seed array run as a detached job and collected"
    budget_seconds: 7200
    max_experiments: 6
  - id: fit
    description: "the power-law fit over the six pinned development cells (P1, P2)"
    budget_seconds: 600
    max_experiments: 1
  - id: confirmation
    description: "the sealed extrapolation: train at the full 60,000 and score the official test set once, compared with the law fitted at the fit phase (P3, P4); the exponent track takes no sealed run (its confirmation is a replication), the second slot is capacity the validator requires"
    budget_seconds: 5400
    max_experiments: 2

research_questions:
  - id: RQ1
    question: "What is the data-scaling exponent alpha of this CNN's held-out cross-entropy, L(N) ~ a N^(-alpha), over N = 500 to 16,000?"
    prior: "between 0.1 and 0.6, most likely 0.2-0.4 — data-scaling exponents reported for image classification are of that order (Hestness et al. 2017; Rosenfeld et al. 2020) (source: knowledge, recalled; verified at METHOD)."
  - id: RQ2
    question: "Is a pure power law (no irreducible term) an adequate description over that range?"
    prior: "adequate on log-log axes (R^2 >= 0.98) over 1.5 decades, about 0.7 (source: uninformed beyond that)."
  - id: RQ3
    question: "Does the law fitted on N <= 16,000 predict the held-out loss at N = 60,000 within 20 percent?"
    prior: "about 0.55 — a 4x extrapolation is short, but curvature toward an irreducible loss makes a pure power law optimistic (source: knowledge of saturating learning curves, recalled)."
  - id: RQ4
    question: "If it misses, which way — is the measured full-data loss above the pure power law's prediction?"
    prior: "above, about 0.65 (saturation) (source: same as RQ3)."

predictions:
  - id: P1
    track: exponent
    statement: "The fitted exponent alpha of seed-mean development cross-entropy over the six cells lies between 0.10 and 0.60."
    rule: {key: primary_metric, op: between, value: [0.10, 0.60]}
  - id: P2
    track: exponent
    statement: "A pure power law fits the six seed-mean cell losses with log-log R^2 of at least 0.98."
    rule: {key: fit_r2, op: ">=", value: 0.98}
  - id: P3
    track: primary
    statement: "Trained on the full 60,000 images, the seed-mean test cross-entropy is within 20 percent of the pure power law's prediction at N = 60,000 (relative error |measured - predicted| / measured <= 0.20)."
    rule: {key: extrapolation_rel_error, op: abs_le, value: 0.20}
  - id: P4
    track: primary
    statement: "The measured full-data test cross-entropy is ABOVE the pure power law's prediction (signed relative error > 0: the law is optimistic)."
    rule: {key: extrapolation_rel_error, op: ">", value: 0.0}

confirmation:
  require: [sealed, replicate]

deliverables:
  - findings.md
  - claims.lock
  - report/index.html
