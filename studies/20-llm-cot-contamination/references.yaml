# The citations a `ref:<key>` evidence id resolves to. Written at the METHOD gate
# (2026-11-03) by the method scholar. Every row was read at its source page on that
# date (arXiv abstract page, publisher / proceedings page, Crossref or OpenAlex record,
# or the provider's own documentation), not quoted from memory; `klein refs verify
# --record` then resolves each DOI / arXiv id mechanically and appends resolved_*.
#
# One locator was left out on purpose: OpenAlex's record for the arXiv DOI of
# GSM8K (10.48550/arXiv.2110.14168, work W3210904070) carries the right authors but
# a corrupted title ("Socratic guiding questions in synthetic arithmetic data ..."),
# so cobbe2021 is resolved by its arXiv id only. doi.org itself redirects that DOI to
# arxiv.org/abs/2110.14168, i.e. the DOI is right and the index is wrong.
