        "mlogloss_e0001",
        "mlogloss_e0008"
      ],
      "strength": "exploratory"
    },
    "C11": {
      "claim": "The anchor's narrow margin over the linear model reflects unstable, under-trained optimisation rather than missing capacity: the same two-block network with working batch normalization at the same 1500 steps reached 0.8960, and its seed sd fell from 0.0255 to 0.0145.",
      "class": "mechanism-interpretation",
      "errata": [],
      "evidence": [
        "E0001",
        "E0004",
        "sweep:fit_noise",
        "art:summary"
      ],
