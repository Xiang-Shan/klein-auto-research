  "claims": {
    "C1": {
      "claim": "A linear softmax on raw pixels reached a seed-mean development macro-F1 of 0.6903 (accuracy 0.7353), far above the chance controls (prior-matched random 0.125, majority class 0.0408) and inside the prior range of 0.50 to 0.85, so a pixel-linear model solves a large part of BloodMNIST but not most of it.",
      "class": "empirical-description",
      "errata": [],
      "evidence": [
        "E0002",
        "art:controls"
      ],
      "numbers": [
        "chance_prior_matched_macro_f1",
        "e0002_accuracy",
        "e0002_macro_f1",
        "macro_f1_name_numeral",
        "majority_macro_f1_dev",
        "p1_high",
        "p1_low"
      ],
      "strength": "exploratory"
    },
    "C10": {
      "claim": "Ranking and calibration did not trade off: expected calibration error fell from 0.0828 at the anchor to 0.0125 at E0008 (0.0086 on the sealed test) and log-loss from 0.6660 to 0.1333.",
      "class": "empirical-description",
      "errata": [],
      "evidence": [
        "E0001",
        "E0008",
        "E0009",
        "art:summary"
      ],
      "numbers": [
