    },
    "C12": {
      "claim": "Before calling a batch-normalization candidate a failure, compare its training-mode and evaluation-mode outputs and recompute the running statistics on the training set; at a constant learning rate and a short budget the default running averages broke inference here.",
      "class": "research-discipline",
