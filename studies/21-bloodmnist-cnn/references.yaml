# The citations a `ref:<key>` evidence id resolves to (shape: kleinlib/references.py).
# Written at the METHOD gate (2026-11-03) by the klein-method-scholar subagent. Every
# row was checked against a record fetched on that date — the publisher full text
# (Europe PMC), Crossref, the arXiv abstract page, PMLR / MLSys / NeurIPS proceedings
# pages, or the repository file — never quoted from memory. `klein refs verify
# --record` then adds the mechanical DOI / arXiv title match (resolved_* fields).
references:
  yang2023medmnist:
    title: "MedMNIST v2 - A large-scale lightweight benchmark for 2D and 3D biomedical image classification"
    authors: "Yang, J.; Shi, R.; Wei, D.; Liu, Z.; Zhao, L.; Ke, B.; Pfister, H.; Ni, B."
    year: 2023
    venue: "Scientific Data 10, article 41 (published 2023-01-19); arXiv v1 2021-10-27"
    doi: "10.1038/s41597-022-01721-8"
    arxiv: "2110.14795"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9852451/"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; published full text via Europe PMC PMC9852451, Table 3 parsed from the JATS XML; cross-checked against the arXiv LaTeX source table tab:2DResults)"
    verified_at: "2026-11-03"
    why: "The dataset and the published reference numbers. Table 3 (BloodMNIST columns, test split, mean of at least 3 trials): ResNet-18 (28) AUC 0.998 / ACC 0.958; ResNet-18 (224) 0.998 / 0.963; ResNet-50 (28) 0.997 / 0.956; ResNet-50 (224) 0.997 / 0.950; auto-sklearn 0.984 / 0.878; AutoKeras 0.998 / 0.961; Google AutoML Vision 0.998 / 0.966. P5's 0.958 and RQ1's ~0.88 are confirmed. The split is a 7:1:2 ratio split of the source images (11,959 / 1,712 / 3,421); the text says nothing about patients. ResNets: Adam lr 0.001, batch 128, 100 epochs, lr x0.1 after epochs 50 and 75, early stopping on validation. auto-sklearn was given the flattened images (no hand-made features)."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "MedMNIST v2 - A large-scale lightweight benchmark for 2D and 3D biomedical image classification"
    resolved_at: "2026-11-03"
  acevedo2020:
    title: "A dataset of microscopic peripheral blood cell images for development of automatic recognition systems"
    authors: "Acevedo, A.; Merino, A.; Alférez, S.; Molina, Á.; Boldú, L.; Rodellar, J."
    year: 2020
    venue: "Data in Brief 30, 105474"
    doi: "10.1016/j.dib.2020.105474"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7182702/"
    verified: true
    verified_by: "klein-method-scholar (Crossref record; full text via Europe PMC PMC7182702 — specifications table and Table 1 read)"
    verified_at: "2026-11-03"
    why: "The source of BloodMNIST: 17,092 single normal-cell images, CellaVision DM96, May Grünwald-Giemsa stain, Hospital Clinic of Barcelona, 2015-2019, 360 x 363 jpg, labelled by clinical pathologists. Table 1 class shares run from 19.48% (neutrophils) to 7.10% (lymphocytes). Each image 'was annotated ... and saved with a random identification number to remove any link and traceability to the patient data' — so no patient grouping can be reconstructed, and the official split cannot be patient-grouped."
    resolved_by: "klein-refs (crossref)"
    resolved_title: "A dataset of microscopic peripheral blood cell images for development of automatic recognition systems"
    resolved_at: "2026-11-03"
  acevedo2019:
