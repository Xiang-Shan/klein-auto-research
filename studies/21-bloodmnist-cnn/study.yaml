schema_version: 3
study_id: "21-bloodmnist-cnn"
goal: "From pixel logistic regression to a small CNN: what earns a keep under a measured floor on 8-class blood-cell microscopy images (BloodMNIST, official split), and how far does a CPU-budget CNN get toward the published MedMNIST baselines?"
domain: "medical image classification (hematology microscopy)"
target: "label"

# The three axes (references/inquiry-model.md). kind fixes the default track
# mode, what "sealed" means, the confirmation default and the strength ceiling.
kind: "predict"                  # predict | estimate | test | simulate | replicate | discover | optimize
profile: "cv"            # generic | ml-research | math | insurance | llm | cv | data-science
# profile_doc: profiles/my-field.md   # ... or a repo-relative profile of your own
audience: "an ML practitioner who trains small CNNs but has not had to prove an improvement is larger than its seed and item noise"

task_type: "classification"       # classification | regression | scalar (simulation is the old spelling)
method_depth: "full" # brief | full
family: "cnn"

# The declared entrypoint. `mutable` is THE per-experiment surface — one
# falsifiable idea per candidate — and nothing else in the study may change
# inside a run. A declared verifier is never listed here.
entrypoint:
  command: ["uv", "run", "--locked", "python", "-u", "train.py"]
  mutable: ["model.py", "train.py"]
  printed: block                # metrics are read from the final `---` block only
  seeds: [0, 1, 2]             # one candidate = one seed array; the notary decides on the mean

# A track owns its metric frontier. Never compare unrelated research tasks globally.
tracks:
  primary:
    mode: frontier
    metric:
      name: "val_macro_f1"
