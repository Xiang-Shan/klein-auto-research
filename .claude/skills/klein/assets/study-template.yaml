# Agent-readable copy of the packaged schema-v2 template in kleinlib/scaffold.py.
schema_version: 2
study_id: "{{STUDY_ID}}"
goal: "{{GOAL}}"
domain: "{{DOMAIN}}"
target: "{{TARGET}}"
task_type: "{{TASK_TYPE}}"       # classification | regression
method_depth: "{{METHOD_DEPTH}}" # brief | full
family: "{{FAMILY}}"

tracks:
  {{TRACK}}:
    metric:
      name: "{{METRIC_NAME}}"
      goal: "{{METRIC_GOAL}}"
      minimum_delta: {{MINIMUM_DELTA}}
    guardrails: {}

data:
  source: "{{DATA_SOURCE}}"
  prepared_path: "{{DATA_PATH}}"
  split:
    kind: stratified              # stratified | random | group | time
    seed: 42
    development_size: 0.20
    test_size: 0.20

max_run_seconds: 600
phases:
  - id: adaptive-1
    description: "split-identity anchor, baseline, then bounded adaptive work"
    budget_seconds: 3600
    max_experiments: 4
  - id: confirmation
    description: "one sealed final-test evaluation per track"
    budget_seconds: 900
    max_experiments: 1

research_questions:
  - id: RQ1
    question: "{{RQ1_QUESTION}}"
    prior: "{{RQ1_PRIOR}}"

predictions_to_falsify:
  - lever: "{{LEVER_1}}"
    predicted_delta: "{{DELTA_1}}"

deliverables:
  - findings.md
  - report/index.html
