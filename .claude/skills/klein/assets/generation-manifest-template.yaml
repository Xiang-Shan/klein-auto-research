# generation/manifest.yaml — the opt-in of the generation layer.
#
# Written ONCE by `klein generation init`, BEFORE the CONSULT gate is recorded, and
# immutable afterwards: its sha256 is carried in the `generation_opted_in` event and
# re-hashed by every `klein generation verify`. Do not hand-edit this file — an edit
# fails `generation manifest` permanently.
#
# Protocol: .claude/skills/klein/references/generation-protocol.md

# The manifest's own schema. 1 is the only value.
generation_schema: 1

# The study this opt-in belongs to; must equal the study's own id.
study_id: NN-slug

# Which capabilities `klein generation verify` will check. A subset of the fixed
# ten-name vocabulary:
#
#   expertise  slates  premortem  parity  contribution
#   surprise   escalation  knowledge  benchmark  design
#
# Dependencies (refused at init when unmet):
#   premortem => slates      parity  => expertise    contribution => slates
#   benchmark => parity      surprise => design
#
# An empty list is the spine: admission receipts before actions, the three chronology
# witnesses, and the dual-pass label — nothing that scores research. A
# known-but-unsupported name is refused with a different message than an unknown one,
# on purpose; `klein generation init --capability <name>` names what this release
# supports. Supported today: `expertise` (references/expert-protocol.md), `slates`
# (references/generation-protocol.md, "Slates and calibration"), `design`
# (references/generation-protocol.md, "Evidence design"), `premortem`
# (references/premortem-protocol.md), and `parity` and `contribution`
# (references/expert-parity-protocol.md).
capabilities: []

# sha256 of each protocol file at init, so a receipt says WHICH rules it was taken
# under. Resolved from the study's repository root; null when the skill directory is
# absent (Klein installed as a dependency of a foreign repo), in which case drift
# simply cannot be observed. Drift is a WARN, never a FAIL.
protocol_hashes:
  references/generation-protocol.md: null

# Set by `--predecessor <study_id>` when this study succeeds another one. A successor
# id restores no blindness: `inherited_exposure` names the sealed blocks and the
# hypothesis / surprise ids the predecessor already saw.
predecessor: null
# predecessor:
#   study_id: NN-earlier-slug
#   successor_receipt: null
#   inherited_exposure: []

# Set by `--custody-holder` / `--custody-mechanism`. An ATTESTATION, never a
# verification: the mechanism cannot check that a bundle stayed unread. Isolation
# means accounts, containers or machines — not directories.
custody: null
# custody:
#   holder: the named custodian
#   mechanism: how access is denied, in one line
