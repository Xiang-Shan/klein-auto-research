[project]
name = "klein-auto-research"
version = "1.2.0"
description = "Klein Auto Research — an agentic, visualization-first ML/Math research framework for actuaries and data scientists"
readme = "README.md"
license = "MIT"
authors = [{ name = "Xiang Shan" }]
requires-python = ">=3.11"
keywords = ["machine-learning", "actuarial-science", "research-framework", "ai-agents", "agentic", "claude-code"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "pyyaml>=6",
    "joblib>=1.4",
    # tutorial renderer (build_tutorial.py): build-time LaTeX -> inline SVG
    # and syntax highlighting; the TUTORIAL stage is mandatory, so these are
    # main dependencies (foreign repos consume the builder through the wheel).
    "pygments>=2.17",
    "ziamath>=0.13",
    "latex2mathml>=3.81",
]

[project.scripts]
klein = "kleinlib.cli:main"

[project.urls]
Repository = "https://github.com/Xiang-Shan/klein-auto-research"
Issues = "https://github.com/Xiang-Shan/klein-auto-research/issues"

[project.optional-dependencies]
encoders = [
    "category-encoders>=2.8",
]
parquet = [
    "pyarrow>=16",
]
gbdt = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
]
deep = [
    "torch>=2.3",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kleinlib"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
# Framework paths only; no shipped study carries tests.
testpaths = [
    "kleinlib/tests",
    ".claude/skills/klein/scripts/tests",
    "scripts/tests",
]
