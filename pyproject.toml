[project]
name = "klein-auto-research"
version = "3.1.0"
description = "Klein Auto Research — process-verifiable research for AI for Science"
readme = "README.md"
license = "MIT"
authors = [{ name = "Xiang Shan" }]
requires-python = ">=3.11"
keywords = ["ai-for-science", "research-framework", "reproducibility", "pre-registration", "experiment-tracking", "ai-agents", "machine-learning", "statistics", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "pyyaml>=6",
    "joblib>=1.4",
    # tutorial renderer (build_tutorial.py): build-time LaTeX -> inline SVG
    # and syntax highlighting. The TUTORIAL stage is mandatory, so these are
    # main dependencies: the builder script travels by skill-directory copy,
    # and its imports must arrive with the klein wheel every consumer installs.
    "pygments>=2.17",
    "ziamath>=0.13",
    "latex2mathml>=3.81",
]

[project.scripts]
klein = "kleinlib.cli:main"

[project.urls]
Homepage = "https://github.com/Xiang-Shan/klein-auto-research"
Repository = "https://github.com/Xiang-Shan/klein-auto-research"
Documentation = "https://github.com/Xiang-Shan/klein-auto-research/blob/main/docs/quickstart.md"
Changelog = "https://github.com/Xiang-Shan/klein-auto-research/blob/main/CHANGELOG.md"
Issues = "https://github.com/Xiang-Shan/klein-auto-research/issues"

[project.optional-dependencies]
encoders = [
    "category-encoders>=2.8",
]
parquet = [
    "pyarrow>=16",
]
gbdt = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
]
deep = [
    "torch>=2.3",
]
foundation = [
    "tabpfn==8.4.0",
]
[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kleinlib"]
exclude = ["kleinlib/tests"]

# The skill travels inside the wheel — protocols, card templates, audience
# profiles, the two report scripts and the worker agents — so an installed Klein
# needs no checkout: `klein explain`, `klein report build`, `klein summarize`,
# `klein skill install` and the vocabulary scan all read these copies
# (kleinlib/resources.py). Byte-identical to the repository (CI's package job).
[tool.hatch.build.targets.wheel.force-include]
".claude/skills/klein/SKILL.md" = "kleinlib/_skill/SKILL.md"
".claude/skills/klein/references" = "kleinlib/_skill/references"
".claude/skills/klein/assets" = "kleinlib/_skill/assets"
".claude/skills/klein/scripts/build_tutorial.py" = "kleinlib/_skill/scripts/build_tutorial.py"
".claude/skills/klein/scripts/summarize_results.py" = "kleinlib/_skill/scripts/summarize_results.py"
".claude/skills/klein/scripts/make_figures.py" = "kleinlib/_skill/scripts/make_figures.py"
".claude/agents" = "kleinlib/_agents"
"AGENTS.md" = "kleinlib/_skill/AGENTS.md"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
# Framework paths only.
testpaths = [
    "kleinlib/tests",
    ".claude/skills/klein/scripts/tests",
    "scripts/tests",
]
