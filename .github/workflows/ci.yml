name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  UV_LOCKED: "1"
  # Harmless today; a later engine package will honour this to skip any
  # network-reaching path outright.
  KLEIN_OFFLINE: "1"

jobs:
  core:
    name: core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the shipped-study verify resolves every candidate commit;
          # the local proof runs with full history, so CI proves the same thing.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Locked core environment
        run: uv sync --locked --extra encoders
      - name: Ruff correctness checks
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync ruff check --output-format github
          kleinlib scripts .claude/skills/klein/scripts
      - name: Core, lifecycle, legacy compatibility, and verifier safety tests
        run: >-
          uv run --no-sync pytest -q
          kleinlib/tests
          .claude/skills/klein/scripts/tests
          scripts/tests
      - name: Every shipped study verifies clean (schema 2 and 3)
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python scripts/verify_shipped_studies.py

  integration:
    name: deep + GBDT integration and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the suite verifies the shipped locks, whose git_head and
          # candidate commits must resolve (a shallow clone fails claims ancestry).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked integration environment
        run: uv sync --locked --extra encoders --extra gbdt --extra deep
      - name: Engine and deep integration tests with coverage floor
        # GBDT smokes self-isolate in subprocesses (war story 5), so one
        # collection is safe even with torch loaded in-process.
        run: >-
          uv run --no-sync pytest -q
          kleinlib/tests
          .claude/skills/klein/scripts/tests
          scripts/tests
          --cov=kleinlib
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  tutorial-browser:
    name: generated tutorial / zero network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked tutorial test environment
        run: uv sync --locked
      - name: Build a fresh tutorial and inspect Chrome's request-start netlog
        run: >-
          uv run --no-sync python scripts/check_generated_tutorial_network.py
          --chrome /usr/bin/google-chrome
          --evidence tutorial-network-evidence.json
      - name: Upload zero-request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-network-evidence
          path: tutorial-network-evidence.json
          if-no-files-found: warn

  reproduction:
    name: documented CPU reproduction anchors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: this job resolves candidate commits (git show, klein
          # replicate) and walks claims.lock's revisions (klein claims verify).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked reproduction environment
        run: uv sync --locked --extra encoders
      # EXHIBIT-ANCHOR: 00-known-truth-quickstart
      # Re-run the exhibit's anchor cell (E0001, the raw-feature logistic
      # identity anchor) on a throwaway copy with the train.py its candidate
      # commit recorded, and assert the printed primary_metric against the value
      # claims.lock pins (`anchor_auc`) within the contract's measured floor
      # (`minimum_delta`, also read from the lock). Nothing is hard-coded here:
      # the commit comes from the manifest, the target and the tolerance from the
      # lock — the same numbers the tutorial and the README quote.
      - name: Study 00 anchor (E0001 reproduces within the measured floor)
        shell: bash
        run: |
          set -euo pipefail
          study=studies/00-known-truth-quickstart
          copy="$RUNNER_TEMP/study00"
          cp -R "$study" "$copy"
          read -r commit target tol < <(uv run --no-sync python - "$study" <<'PY'
          import json, sys
          study = sys.argv[1]
          manifest = json.load(open(f"{study}/runs/E0001/manifest.json"))
          lock = json.load(open(f"{study}/claims.lock"))
          numbers = lock["numbers"]
          print(manifest["candidate_commit"], numbers["anchor_auc"]["value"], numbers["minimum_delta"]["value"])
          PY
          )
          git show "$commit:$study/train.py" > "$copy/train.py"
          cd "$copy"
          uv --project "$GITHUB_WORKSPACE" run --no-sync python -u prepare.py
          KLEIN_EVALUATION_KIND=development KLEIN_EXPERIMENT_ID=E0001 KLEIN_TRACK=primary \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py | tee "$RUNNER_TEMP/study00-train.log"
          awk -F': *' -v t="$target" -v tol="$tol" \
            '/^primary_metric:/{m=$2} END{d=m-t; if(d<0)d=-d; printf "metric=%s target=%s |delta|=%.6f tol=%s\n", m, t, d, tol; exit (d<=tol)?0:1}' \
            "$RUNNER_TEMP/study00-train.log"
      # EXHIBIT-ANCHOR: 12-insurance-claims-frequency
      # Same shape as study 00's anchor: E0003 (the boosted-tree rung, the study's
      # incumbent) re-runs on a throwaway copy with the train.py its candidate
      # commit recorded; the target is the lock's `dev_incumbent`; the tolerance
      # is the plan's ±0.003 reproduction band for this dataset (well inside the
      # study's measured floor of 0.0375805, which is a comparison floor, not a
      # reproduction band).
      - name: Study 12 anchor (E0003 reproduces within ±0.003)
        shell: bash
        run: |
          set -euo pipefail
          study=studies/12-insurance-claims-frequency
          copy="$RUNNER_TEMP/study12"
          cp -R "$study" "$copy"
          read -r commit target < <(uv run --no-sync python - "$study" <<'PY'
          import json, sys
          study = sys.argv[1]
          manifest = json.load(open(f"{study}/runs/E0003/manifest.json"))
          lock = json.load(open(f"{study}/claims.lock"))
          print(manifest["candidate_commit"], lock["numbers"]["dev_incumbent"]["value"])
          PY
          )
          git show "$commit:$study/train.py" > "$copy/train.py"
          cd "$copy"
          uv --project "$GITHUB_WORKSPACE" run --no-sync python -u prepare.py
          KLEIN_EVALUATION_KIND=development KLEIN_EXPERIMENT_ID=E0003 KLEIN_TRACK=primary \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py | tee "$RUNNER_TEMP/study12-train.log"
          awk -F': *' -v t="$target" \
            '/^primary_metric:/{m=$2} END{d=m-t; if(d<0)d=-d; printf "metric=%s target=%s |delta|=%.6f tol=0.003\n", m, t, d; exit (d<=0.003)?0:1}' \
            "$RUNNER_TEMP/study12-train.log"
      - name: Execute the Study 03 v2 anchor (seed-block determinism on Linux)
        shell: bash
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/study03"
          cp -R studies/03-noisy-rosenbrock-dfo "$copy"
          cd "$copy"
          # The committed working train.py holds the study's incumbent (4x50
          # restarts); the anchor row E0001 used OPTIMIZER="nm". Flip the one
          # config line on the throwaway copy to re-run the anchor cell.
          sed -i 's/^OPTIMIZER = "[a-z_]*"/OPTIMIZER = "nm"/' train.py
          uv --project "$GITHUB_WORKSPACE" run --no-sync python prepare.py
          KLEIN_EVALUATION_KIND=development KLEIN_EXPERIMENT_ID=E0001 KLEIN_TRACK=primary \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py | tee "$RUNNER_TEMP/study03-train.log"
          awk -F': *' '/^primary_metric:/{m=$2} END{d=m-1.251208; if(d<0)d=-d; printf "metric=%s |delta|=%.6f\n", m, d; exit (d<=0.001)?0:1}' "$RUNNER_TEMP/study03-train.log"
      - name: Checked-out exhibits remain byte-clean
        run: test -z "$(git status --porcelain)"

  exhibits:
    name: schema-3 exhibits verify from a clean checkout
    runs-on: ubuntu-latest
    # A sync, one doctor report, the shipped sweep, then per exhibit: prepare, verify
    # with the figure re-render (study 12's takes minutes on a two-vCPU runner), the
    # claims law, and one replicate / one --verify-only.
    timeout-minutes: 25
    env:
      # The exhibits must resolve their evidence from the repository alone — no
      # data hub on the box, no network — which is the promise a stranger cloning
      # this repository is given.
      KLEIN_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: this job resolves candidate commits (git show, klein
          # replicate) and walks claims.lock's revisions (klein claims verify).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked exhibit environment
        run: uv sync --locked --extra encoders
      - name: klein doctor reports a ready machine and every bundled source resolves
        shell: bash
        run: |
          set -euo pipefail
          unset DATA_HUB
          uv run --no-sync klein doctor
          uv run --no-sync python - <<'PY'
          from pathlib import Path

          from kleinlib import doctor, sources

          # "Ready" for this job means the toolchain, the renderer and the data
          # fallback — not every optional extra (torch and the GBDT libraries are
          # deliberately absent here; the ledgers verify without them).
          REQUIRED = {"python", "uv", "git", "extra: encoders", "tutorial renderer", "device", "DATA_HUB"}
          report = doctor.run_doctor()
          not_ok = {c["name"]: c["message"] for c in report["checks"] if c["name"] in REQUIRED and not c["ok"]}
          assert not not_ok, f"doctor checks this job requires are not ok: {not_ok}"
          assert REQUIRED <= {c["name"] for c in report["checks"]}, "a required doctor check was not reported"

          # Every bundled dataset, addressed the way a study contract addresses
          # it: `bundled:<name>` for a directory holding one data file, and
          # `bundled:<name>/<file>` for a multi-file one (hubble1929 ships two
          # tables and no single one). Prose beside the data is not data.
          PROSE = {"README.md", "DATA_LICENSE", "LICENSE", "NOTES.md"}
          directories = sorted(q for q in Path("datasets").iterdir() if q.is_dir())
          assert directories, "no bundled datasets found under datasets/"
          tags = []
          for directory in directories:
              files = sorted(
                  q.name for q in directory.iterdir() if q.is_file() and q.name not in PROSE
              )
              assert files, f"bundled dataset {directory.name} carries no data file"
              if len(files) == 1 and files[0].endswith((".csv", ".csv.gz")):
                  tags.append(f"bundled:{directory.name}")
              else:
                  tags += [f"bundled:{directory.name}/{name}" for name in files]
          bad = []
          for tag in tags:
              report = sources.describe(tag)
              print(f"{tag} -> resolvable={report['resolvable']} {report['detail']}")
              if not report["resolvable"]:
                  bad.append(tag)
          assert not bad, f"bundled sources that do not resolve offline: {bad}"
          PY
      - name: Every shipped schema-2 study verifies clean
        shell: bash
        run: |
          set -euo pipefail
          unset DATA_HUB
          uv run --no-sync python scripts/verify_shipped_studies.py
      - name: Every schema-3 exhibit verifies, locks and re-renders identically (pixel law)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unset DATA_HUB
          found=0
          for study in studies/00-* studies/1[0-3]-*; do
            [ -f "$study/study.yaml" ] || continue
            grep -qE '^schema_version:[[:space:]]*3[[:space:]]*$' "$study/study.yaml" || continue
            found=1
            echo "::group::$study"
            if [ -f "$study/prepare.py" ]; then
              ( cd "$study" && uv --project "$GITHUB_WORKSPACE" run --no-sync python -u prepare.py )
            fi
            report="$RUNNER_TEMP/verify-$(basename "$study").log"
            uv run --no-sync klein verify --study "$study" --numbers --evidence-use --no-receipt | tee "$report"
            uv run --no-sync klein claims verify --study "$study"
            if [ -f "$study/figures/make_figures.py" ]; then
              # verify re-rendered the figures into a temp dir with the prepared data present
              # and compared them under the pixel law (bytes first, decoded pixels when a PNG
              # encoder differs across platforms). Here that comparison must have HAPPENED:
              # every figure identical, or a pixel difference this x86_64 runner reports
              # against figures rendered on arm64 (named, counted — study 12's Lorenz curve
              # moves a pixel across CPU families). A "[WARN] ... exited" or "could not run"
              # line means the script never ran, and that fails.
              grep -E '^\[OK\] figure re-render: ([0-9]+ figure\(s\) re-render (byte-)?identically|\[WARN\] figures/make_figures.py re-renders .* with different pixels on )' "$report" \
                || { echo "figure re-render did not run for $study" >&2; exit 1; }
            fi
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "note: no schema-3 exhibit present yet (studies/00-*, studies/1[0-3]-*) — nothing to verify"
          fi
      - name: Study 10 — a development cell replicates in a detached worktree (E0002)
        shell: bash
        run: |
          set -euo pipefail
          unset DATA_HUB
          study=studies/10-hubble-1929-replication
          uv run --no-sync klein replicate E0002 --study "$study"
          uv run --no-sync python - "$study" <<'PY'
          import glob, json, sys
          records = sorted(glob.glob(f"{sys.argv[1]}/runs/E0002/replications/*.json"))
          last = json.load(open(records[-1]))
          assert last["mode"] == "replicate" and last["reproduced"] is True, last
          print("E0002 reproduced:", last["evidence_id"], "difference", last["difference"])
          PY
      - name: Study 11 — the declared verifier re-scores a pinned object in a fresh process (E0004, --verify-only)
        shell: bash
        run: |
          set -euo pipefail
          unset DATA_HUB
          study=studies/11-exact-verifier-construction
          uv run --no-sync klein replicate E0004 --verify-only --study "$study"
          uv run --no-sync python - "$study" <<'PY'
          import glob, json, sys
          records = sorted(glob.glob(f"{sys.argv[1]}/runs/E0004/replications/*.json"))
          last = json.load(open(records[-1]))
          assert last["mode"] == "verify" and last["reproduced"] is True, last
          print("E0004 re-verified:", last["evidence_id"], "difference", last["difference"])
          PY
      - name: A verified checkout is byte-clean
        run: test -z "$(git status --porcelain)"

  e2e:
    name: both lanes end to end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Two lanes now: the v1 compatibility path and the schema-3 proof, each in
    # its own throwaway worktree with its own uv sync.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Byte-exact git checkout on Windows (no CRLF rewrite, long paths)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked outer environment (the script syncs its own throwaway worktree separately)
        run: uv sync --locked
      - name: Both lanes — v1 compatibility, and one typed inquiry end to end
        run: uv run --no-sync python scripts/verify_e2e.py --lane all

  cli-portability:
    name: CLI smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows now also runs the full kleinlib/tests + scripts/tests suite (see
    # below), which is heavier than the --help/test_data_splits smoke macOS
    # gets and Windows runners tend to be slower; 15 min was tight for that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Byte-exact git checkout on Windows (no CRLF rewrite, long paths)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          # Full history: the Windows lane runs the whole suite, which verifies the
          # shipped locks against their pinned commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked CLI environment
        run: uv sync --locked --extra encoders
      - name: Split determinism holds on ${{ matrix.os }}
        run: uv run --no-sync pytest -q kleinlib/tests/test_data_splits.py
      # Every verb and sub-verb the 2.0 documents promise (AGENTS.md, README.md,
      # CLAUDE.md, the protocols under .claude/skills/klein/references/): a verb
      # a document names but the parser does not carry is a broken instruction,
      # and --help is the cheapest way to prove the whole surface loads on a
      # platform that is not Linux.
      - name: Public command surface is importable
        run: |
          uv run --no-sync klein --help
          uv run --no-sync klein new --help
          uv run --no-sync klein gate --help
          uv run --no-sync klein gate record --help
          uv run --no-sync klein gate override --help
          uv run --no-sync klein preflight --help
          uv run --no-sync klein run-one --help
          uv run --no-sync klein recover --help
          uv run --no-sync klein status --help
          uv run --no-sync klein finalize --help
          uv run --no-sync klein noise-floor --help
          uv run --no-sync klein verify --help
          uv run --no-sync klein headroom --help
          uv run --no-sync klein headroom ack --help
          uv run --no-sync klein stop --help
          uv run --no-sync klein stop ack --help
          uv run --no-sync klein predict --help
          uv run --no-sync klein predict list --help
          uv run --no-sync klein predict adjudicate --help
          uv run --no-sync klein claims --help
          uv run --no-sync klein claims init --help
          uv run --no-sync klein claims pin --help
          uv run --no-sync klein claims number --help
          uv run --no-sync klein claims add --help
          uv run --no-sync klein claims erratum --help
          uv run --no-sync klein claims verify --help
          uv run --no-sync klein replicate --help
          uv run --no-sync klein sweep --help
          uv run --no-sync klein sweep register --help
          uv run --no-sync klein doctor --help
      - name: Full engine + scripts test suite on Windows (no coverage)
        if: matrix.os == 'windows-latest'
        # bash, not pwsh: a multi-line pwsh step exits with its LAST command's
        # status, which hid a failing pytest behind `klein --help` once.
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest kleinlib/tests scripts/tests -q
          uv run --no-sync klein --help

  package:
    name: build and clean-wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Assert the committed lock and build artifacts
        run: |
          uv lock --check
          uv build --no-sources --out-dir dist
      - name: Install the wheel without the source checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c "import importlib.metadata as m; import kleinlib; v = m.version('klein-auto-research'); assert v == kleinlib.__version__ and v.count('.') == 2, v; print(v, kleinlib.__file__)"
          "$venv/bin/klein" --help
          "$venv/bin/klein" new 99-wheel-smoke \
            --root "$RUNNER_TEMP/wheel-studies" \
            --goal "clean wheel scaffold" --domain test --target y --family linear \
            --metric val_auc --goal-direction higher --data csv:fixture.csv
          test -s "$RUNNER_TEMP/wheel-studies/99-wheel-smoke/study_state.json"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
