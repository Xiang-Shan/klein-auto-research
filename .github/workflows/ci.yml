name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  UV_LOCKED: "1"
  # Harmless today; a later engine package will honour this to skip any
  # network-reaching path outright.
  KLEIN_OFFLINE: "1"

jobs:
  core:
    name: core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Locked core environment
        run: uv sync --locked --extra encoders
      - name: Ruff correctness checks
        if: matrix.python-version == '3.13'
        run: >-
          uv run --no-sync ruff check --output-format github
          kleinlib scripts .claude/skills/klein/scripts
      - name: Core, lifecycle, legacy compatibility, and verifier safety tests
        run: >-
          uv run --no-sync pytest -q
          kleinlib/tests
          .claude/skills/klein/scripts/tests
          scripts/tests
      - name: All immutable v1 studies validate with an explicit warning
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          for study in \
            studies/00-glm-claims-quickstart
          do
            output="$(uv run --no-sync klein verify --study "$study")"
            printf '%s\n' "$output"
            case "$output" in
              *deprecated*) ;;
              *) echo "missing explicit v1 warning for $study" >&2; exit 1 ;;
            esac
          done
      - name: Every shipped schema-2 study verifies clean
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python scripts/verify_shipped_studies.py

  integration:
    name: deep + GBDT integration and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked integration environment
        run: uv sync --locked --extra encoders --extra gbdt --extra deep
      - name: Engine and deep integration tests with coverage floor
        # GBDT smokes self-isolate in subprocesses (war story 5), so one
        # collection is safe even with torch loaded in-process.
        run: >-
          uv run --no-sync pytest -q
          kleinlib/tests
          .claude/skills/klein/scripts/tests
          scripts/tests
          --cov=kleinlib
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  tutorial-browser:
    name: generated tutorial / zero network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked tutorial test environment
        run: uv sync --locked
      - name: Build a fresh tutorial and inspect Chrome's request-start netlog
        run: >-
          uv run --no-sync python scripts/check_generated_tutorial_network.py
          --chrome /usr/bin/google-chrome
          --evidence tutorial-network-evidence.json
      - name: Upload zero-request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-network-evidence
          path: tutorial-network-evidence.json
          if-no-files-found: warn

  reproduction:
    name: documented CPU reproduction anchors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked reproduction environment
        run: uv sync --locked --extra encoders
      - name: Execute the Study 00 README bootstrap and committed state
        shell: bash
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/study00"
          cp -R studies/00-glm-claims-quickstart "$copy"
          cd "$copy"
          unset DATA_HUB
          uv --project "$GITHUB_WORKSPACE" run --no-sync python \
            "$GITHUB_WORKSPACE/scripts/run_with_log.py" --timeout-seconds 300 \
            --log "$RUNNER_TEMP/study00-prepare.log" -- \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u prepare.py
          grep -q "data source: bundled" "$RUNNER_TEMP/study00-prepare.log"
          uv --project "$GITHUB_WORKSPACE" run --no-sync python \
            "$GITHUB_WORKSPACE/scripts/run_with_log.py" --timeout-seconds 600 \
            --log "$RUNNER_TEMP/study00-train.log" -- \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py
          awk -F': *' '/^primary_metric:/{m=$2} END{d=m-0.664322; if(d<0)d=-d; printf "metric=%s |delta|=%.6f\n", m, d; exit (d<=0.001)?0:1}' "$RUNNER_TEMP/study00-train.log"
      - name: Execute the Study 03 v2 anchor (seed-block determinism on Linux)
        shell: bash
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/study03"
          cp -R studies/03-noisy-rosenbrock-dfo "$copy"
          cd "$copy"
          # The committed working train.py holds the study's incumbent (4x50
          # restarts); the anchor row E0001 used OPTIMIZER="nm". Flip the one
          # config line on the throwaway copy to re-run the anchor cell.
          sed -i 's/^OPTIMIZER = "[a-z_]*"/OPTIMIZER = "nm"/' train.py
          uv --project "$GITHUB_WORKSPACE" run --no-sync python prepare.py
          KLEIN_EVALUATION_KIND=development KLEIN_EXPERIMENT_ID=E0001 KLEIN_TRACK=primary \
            uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py | tee "$RUNNER_TEMP/study03-train.log"
          awk -F': *' '/^primary_metric:/{m=$2} END{d=m-1.251208; if(d<0)d=-d; printf "metric=%s |delta|=%.6f\n", m, d; exit (d<=0.001)?0:1}' "$RUNNER_TEMP/study03-train.log"
      - name: Checked-out exhibits remain byte-clean
        run: test -z "$(git status --porcelain)"

  e2e:
    name: legacy compatibility end to end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Byte-exact git checkout on Windows (no CRLF rewrite, long paths)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked outer environment (the script syncs its own throwaway worktree separately)
        run: uv sync --locked
      - name: Verify the portable temporary-worktree lifecycle
        run: uv run --no-sync python scripts/verify_e2e.py

  cli-portability:
    name: CLI smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows now also runs the full kleinlib/tests + scripts/tests suite (see
    # below), which is heavier than the --help/test_data_splits smoke macOS
    # gets and Windows runners tend to be slower; 15 min was tight for that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Byte-exact git checkout on Windows (no CRLF rewrite, long paths)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked CLI environment
        run: uv sync --locked --extra encoders
      - name: Split determinism holds on ${{ matrix.os }}
        run: uv run --no-sync pytest -q kleinlib/tests/test_data_splits.py
      - name: Public command surface is importable
        run: |
          uv run --no-sync klein --help
          uv run --no-sync klein new --help
          uv run --no-sync klein gate --help
          uv run --no-sync klein headroom --help
          uv run --no-sync klein preflight --help
          uv run --no-sync klein run-one --help
          uv run --no-sync klein recover --help
          uv run --no-sync klein status --help
          uv run --no-sync klein finalize --help
          uv run --no-sync klein verify --help
      - name: Full engine + scripts test suite on Windows (no coverage)
        if: matrix.os == 'windows-latest'
        run: |
          uv run --no-sync pytest kleinlib/tests scripts/tests -x -q
          uv run --no-sync klein --help

  package:
    name: build and clean-wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Assert the committed lock and build artifacts
        run: |
          uv lock --check
          uv build --no-sources --out-dir dist
      - name: Install the wheel without the source checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c "import importlib.metadata as m; import kleinlib; v = m.version('klein-auto-research'); assert v == kleinlib.__version__ and v.count('.') == 2, v; print(v, kleinlib.__file__)"
          "$venv/bin/klein" --help
          "$venv/bin/klein" new 99-wheel-smoke \
            --root "$RUNNER_TEMP/wheel-studies" \
            --goal "clean wheel scaffold" --domain test --target y --family linear \
            --metric val_auc --goal-direction higher --data csv:fixture.csv
          test -s "$RUNNER_TEMP/wheel-studies/99-wheel-smoke/study_state.json"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
