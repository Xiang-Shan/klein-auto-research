name: scheduled-hardening

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # A change to this workflow is proved in the pull request that makes it, not on
  # the following Monday: two defects sat red on main for weeks that way.
  pull_request:
    paths: [".github/workflows/scheduled.yml"]

permissions:
  contents: read

concurrency:
  group: scheduled-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  dependency-audit:
    name: dependency resolution audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the anchors restore files from candidate commits
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Lockfile is internally current
        run: uv lock --check
      - name: Preview dependency upgrades without rewriting the lock
        run: uv lock --upgrade --dry-run
      - name: Install and test the committed all-extras resolution
        run: |
          uv sync --locked --all-extras
          uv run --no-sync pytest -q kleinlib/tests
      - name: klein doctor reports the resolved environment
        # The audit's whole point is drift: the upgrade preview says what COULD
        # move, and this says what the box actually has — interpreter, uv, git,
        # every extra, the tutorial renderer, the device, and $DATA_HUB. --strict
        # so a silently-missing extra fails the audit instead of printing a line
        # nobody reads.
        run: uv run --no-sync klein doctor --json --strict

  apple-mps:
    name: Apple Silicon MPS canary
    # macos-latest is Apple Silicon. A pinned image is retired on GitHub's calendar
    # (macos-14 went on 2026-11-02 and this job was cancelled at start from then on).
    runs-on: macos-latest
    timeout-minutes: 25
    # The hosted runner has run out of MPS memory weekly since 2026-08-17 (a runner
    # defect, not an engine one): the canary reports but never blocks.
    continue-on-error: true
    env:
      PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the anchors restore files from candidate commits
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked deep environment
        run: uv sync --locked --extra deep
      - name: Assert the runner and MPS backend
        run: >-
          uv run --no-sync python -c
          "import platform, torch;
          assert platform.machine() == 'arm64', platform.machine();
          assert torch.backends.mps.is_built();
          assert torch.backends.mps.is_available();
          x = torch.arange(8, dtype=torch.float32, device='mps');
          assert float((x * 2).sum().cpu()) == 56.0;
          print(platform.platform(), torch.__version__)"
      - name: Torch loop MPS canary
        run: uv run --no-sync pytest -q kleinlib/tests/test_torch_loop.py

  exhibits-network:
    # Klein 2.3 exhibits pin their data by sha256 to public hosts (NBER, Zenodo,
    # GitHub). Weekly, with the network ON: re-fetch and re-prepare each study's data
    # (the pin proves the bytes did not change), then re-execute one development run
    # per study in a detached worktree. Study 20's ledgered model calls are replayed
    # offline instead (`--replay`), so this job never queries a model.
    name: exhibits — re-fetch pinned data and replicate one run each
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KLEIN_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked environment
        run: uv sync --locked --extra encoders --extra deep
      - name: Re-prepare and replicate
        shell: bash
        run: |
          set -euo pipefail
          # replicate files its own record as a local commit (never pushed).
          git config user.name "klein-ci"; git config user.email "klein-ci@users.noreply.github.com"
          # A replication on the machine that ran a study must match at the study's own
          # tolerance. This runner is another CPU and BLAS, and which one varies from
          # run to run; across machines the job states the tolerance it asserts, and
          # the record says so (`tolerance_source: --tolerance`):
          # - Study 23's `att` metric is declared exact (tolerance 0 at home). An
          #   iterative logit moves in its last digits elsewhere (6e-7 relative,
          #   measured); the assertion is the resolution the contract declares, one cent.
          # - Study 22 trains a CNN over three seeds. On one runner the mean reproduced
          #   to the last digit, on another it moved 0.003 against a 0.001 analysis
          #   resolution (run 44014605418). The assertion is the run's own recorded
          #   seed-to-seed standard deviation (`primary_metric_std` in its manifest):
          #   another machine must land inside one seed's worth of noise.
          # - Study 21 replicates within its measured noise floor; no override.
          for triple in 23-lalonde-causal-replication:E0002:0.01 21-bloodmnist-cnn:E0001: 22-cnn-data-scaling:E0001:seed-std; do
            IFS=: read -r slug run tolerance <<<"$triple"
            study="studies/$slug"
            test -d "$study" || { echo "skip $study (not present)"; continue; }
            if [ "$tolerance" = "seed-std" ]; then
              tolerance="$(uv run --no-sync python -c 'import json,sys; print(json.load(open(sys.argv[1]))["metrics"]["primary_metric_std"])' "$study/runs/$run/manifest.json")"
            fi
            ( cd "$study" && uv run --no-sync python -u prepare.py )
            uv run --no-sync klein replicate --study "$study" "$run" --quiet ${tolerance:+--tolerance "$tolerance"}
          done
          if [ -d studies/20-llm-cot-contamination ]; then
            # Study 20's source is bundled, so it prepares offline; a replay re-runs on
            # the SAME prepared input and refuses without it (this step never prepared
            # it, and failed the first time anything before it passed).
            ( cd studies/20-llm-cot-contamination && KLEIN_OFFLINE=1 uv run --no-sync python -u prepare.py )
            KLEIN_OFFLINE=1 uv run --no-sync klein replicate --study studies/20-llm-cot-contamination E0002 --replay --quiet
          fi
      - name: The checkout stays byte-clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  shipped-reports:
    name: shipped report acceptance in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The fixture job in ci.yml is the gate on every push; this one measures the
    # eight reports we already shipped, which no push can change. A regression
    # here is a real regression, so it blocks the scheduled run.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: pdftotext for the print check
        # Without poppler-utils the print check still runs, it just records
        # "print text assertions skipped: pdftotext absent" — installing it is
        # what turns the print row into a real assertion.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Locked environment
        run: uv sync --locked
      - name: Overflow, nav reveal, image decode, zero network and print
        run: >-
          uv run --no-sync python scripts/check_shipped_reports.py
          --chrome /usr/bin/google-chrome
          --evidence shipped-reports-evidence.json
      - name: Upload the measurement record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-reports-evidence
          path: shipped-reports-evidence.json
          if-no-files-found: warn
