name: scheduled-hardening

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  dependency-audit:
    name: dependency resolution audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the anchors restore files from candidate commits
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Lockfile is internally current
        run: uv lock --check
      - name: Preview dependency upgrades without rewriting the lock
        run: uv lock --upgrade --dry-run
      - name: Install and test the committed all-extras resolution
        run: |
          uv sync --locked --all-extras
          uv run --no-sync pytest -q kleinlib/tests
      - name: klein doctor reports the resolved environment
        # The audit's whole point is drift: the upgrade preview says what COULD
        # move, and this says what the box actually has — interpreter, uv, git,
        # every extra, the tutorial renderer, the device, and $DATA_HUB. --strict
        # so a silently-missing extra fails the audit instead of printing a line
        # nobody reads.
        run: uv run --no-sync klein doctor --json --strict

  apple-mps:
    name: Apple Silicon MPS canary
    runs-on: macos-14
    timeout-minutes: 25
    # The hosted runner has run out of MPS memory weekly since 2026-08-17 (a runner
    # defect, not an engine one): the canary reports but never blocks.
    continue-on-error: true
    env:
      PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the anchors restore files from candidate commits
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked deep environment
        run: uv sync --locked --extra deep
      - name: Assert the runner and MPS backend
        run: >-
          uv run --no-sync python -c
          "import platform, torch;
          assert platform.machine() == 'arm64', platform.machine();
          assert torch.backends.mps.is_built();
          assert torch.backends.mps.is_available();
          x = torch.arange(8, dtype=torch.float32, device='mps');
          assert float((x * 2).sum().cpu()) == 56.0;
          print(platform.platform(), torch.__version__)"
      - name: Torch loop MPS canary
        run: uv run --no-sync pytest -q kleinlib/tests/test_torch_loop.py

  deep-exhibit:
    name: study 13 anchor cells on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KLEIN_DEVICE: cpu
      KLEIN_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the anchors restore files from candidate commits
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked deep environment
        run: uv sync --locked --extra deep
      # EXHIBIT-ANCHOR: 13-charlm-fixed-budget
      # Study 13 budgets in STEPS, not seconds: its anchor cells re-run on CPU and
      # must land inside the study's own measured floor (`minimum_delta`, the
      # paired seed-difference floor the lock pins). Two cells: E0001 (the anchor,
      # target = the lock alias e0001_val_loss) and E0003 (weight tying, the
      # largest effect; target = its row in tables/frontier.tsv, a lock-pinned
      # artifact). Each restores the mutable surface (model.py, train.py) from its
      # candidate commit; targets come from the lock and its pinned table, never
      # from this file.
      - name: Study 13 anchor cells re-run on CPU within the measured floor
        shell: bash
        run: |
          set -euo pipefail
          study=studies/13-charlm-fixed-budget
          read -r tol e1 e3 < <(uv run --no-sync python - "$study" <<'PY'
          import csv, json, sys
          study = sys.argv[1]
          numbers = json.load(open(f"{study}/claims.lock"))["numbers"]
          rows = {r["experiment"]: r for r in csv.DictReader(open(f"{study}/tables/frontier.tsv"), delimiter="\t")}
          print(numbers["minimum_delta"]["value"], numbers["e0001_val_loss"]["value"], rows["E0003"]["val_nats_per_char"])
          PY
          )
          for cell in "E0001:$e1" "E0003:$e3"; do
            run="${cell%%:*}"; target="${cell##*:}"
            copy="$RUNNER_TEMP/study13-$run"
            cp -R "$study" "$copy"
            commit="$(uv run --no-sync python -c "import json,sys;print(json.load(open(sys.argv[1]))['candidate_commit'])" "$study/runs/$run/manifest.json")"
            for f in model.py train.py; do git show "$commit:$study/$f" > "$copy/$f"; done
            ( cd "$copy" && uv --project "$GITHUB_WORKSPACE" run --no-sync python -u prepare.py )
            ( cd "$copy" && KLEIN_DEVICE=cpu KLEIN_EVALUATION_KIND=development KLEIN_EXPERIMENT_ID="$run" KLEIN_TRACK=primary \
                uv --project "$GITHUB_WORKSPACE" run --no-sync python -u train.py | tee "$RUNNER_TEMP/study13-$run.log" )
            awk -F': *' -v t="$target" -v tol="$tol" -v run="$run" \
              '/^primary_metric:/{m=$2} END{d=m-t; if(d<0)d=-d; printf "%s metric=%s target=%s |delta|=%.6f tol=%s\n", run, m, t, d, tol; exit (d<=tol)?0:1}' \
              "$RUNNER_TEMP/study13-$run.log"
          done
      - name: The checkout stays byte-clean
        run: test -z "$(git status --porcelain)"

  exhibits-network:
    # Klein 2.3 exhibits pin their data by sha256 to public hosts (NBER, Zenodo,
    # GitHub). Weekly, with the network ON: re-fetch and re-prepare each study's data
    # (the pin proves the bytes did not change), then re-execute one development run
    # per study in a detached worktree. Study 20's ledgered model calls are replayed
    # offline instead (`--replay`), so this job never queries a model.
    name: exhibits — re-fetch pinned data and replicate one run each
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KLEIN_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Locked environment
        run: uv sync --locked --extra encoders --extra deep
      - name: Re-prepare and replicate
        shell: bash
        run: |
          set -euo pipefail
          # replicate files its own record as a local commit (never pushed).
          git config user.name "klein-ci"; git config user.email "klein-ci@users.noreply.github.com"
          for pair in 23-lalonde-causal-replication:E0002 21-bloodmnist-cnn:E0001 22-cnn-data-scaling:E0001; do
            study="studies/${pair%%:*}"; run="${pair##*:}"
            test -d "$study" || { echo "skip $study (not present)"; continue; }
            ( cd "$study" && uv run --no-sync python -u prepare.py )
            uv run --no-sync klein replicate --study "$study" "$run" --quiet
          done
          if [ -d studies/20-llm-cot-contamination ]; then
            KLEIN_OFFLINE=1 uv run --no-sync klein replicate --study studies/20-llm-cot-contamination E0002 --replay --quiet
          fi
      - name: The checkout stays byte-clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

  shipped-reports:
    name: shipped report acceptance in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The fixture job in ci.yml is the gate on every push; this one measures the
    # twelve reports we already shipped, which no push can change. A regression
    # here is a real regression, so it blocks the scheduled run.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: pdftotext for the print check
        # Without poppler-utils the print check still runs, it just records
        # "print text assertions skipped: pdftotext absent" — installing it is
        # what turns the print row into a real assertion.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Locked environment
        run: uv sync --locked
      - name: Overflow, nav reveal, image decode, zero network and print
        run: >-
          uv run --no-sync python scripts/check_shipped_reports.py
          --chrome /usr/bin/google-chrome
          --evidence shipped-reports-evidence.json
      - name: Upload the measurement record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-reports-evidence
          path: shipped-reports-evidence.json
          if-no-files-found: warn
